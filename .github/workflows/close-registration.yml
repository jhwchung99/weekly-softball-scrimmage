name: Close registration

# Tuesday 12am ET / midnight (Section 1) — short on purpose (~15 hours
# after Monday's open) so the organizer has the rest of the week to book
# a permit sized to the actual headcount. Same DST-duplicate-firing
# pattern as open-registration.yml; see that file's comment and
# src/lib/scheduling.ts / src/lib/time.ts.
on:
  schedule:
    - cron: '0 4 * * 2' # 12am EDT Tuesday (UTC-4) = 4am UTC Tuesday
    - cron: '0 5 * * 2' # 12am EST Tuesday (UTC-5) = 5am UTC Tuesday
  workflow_dispatch: {} # manual trigger, for testing

jobs:
  close-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Call close-registration endpoint
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.APP_URL }}/api/cron/close-registration" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
