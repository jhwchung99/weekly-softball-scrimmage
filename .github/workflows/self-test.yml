name: Self test

# Manual only — no schedule. This is the "is production actually wired up?"
# button: it proves APP_URL and CRON_SECRET reach the app, and that Sheets,
# Redis, ntfy and Gmail all work with whatever env Vercel currently holds.
#
# Redis is the one you cannot learn any other way. The mutation lock and the
# rate limiter both fail open when Upstash is unconfigured, so production runs
# unlocked and says nothing about it — see docs/adr/0001 and lib/redis.
#
# The endpoint writes no Sheets row and mails only the organizer, so it is safe
# to run at any hour. It is the only workflow that calls the app: nothing else
# runs on a schedule (docs/adr/0009).
on:
  workflow_dispatch: {}

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Call self-test endpoint
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.APP_URL }}/api/cron/self-test" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
